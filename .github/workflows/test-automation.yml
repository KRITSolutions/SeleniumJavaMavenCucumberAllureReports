name: Selenium Test Automation - XPath Practice

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 8 * * *'   # Daily at 8 AM
  workflow_dispatch:      # Manual trigger support

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [11]
        browser: [chrome, firefox]

    steps:
    # ----------------------------
    # Checkout Code
    # ----------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # ----------------------------
    # Setup Java
    # ----------------------------
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: temurin
        cache: maven

    # ----------------------------
    # Install Dependencies
    # ----------------------------
    - name: Install Dependencies
      run: mvn clean install -DskipTests=true

    # ----------------------------
    # Run Tests
    # ----------------------------
    - name: Run Cucumber Tests
      run: mvn test -Dbrowser=${{ matrix.browser }} -Dgroups="Smoke,Regression"
      continue-on-error: true

    # ----------------------------
    # Generate Allure Report
    # ----------------------------
    - name: Generate Allure Report
      if: always()
      run: mvn allure:report

    # ----------------------------
    # Upload Allure Report
    # ----------------------------
    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-${{ matrix.browser }}
        path: target/site/allure-maven-plugin/

    # ----------------------------
    # Upload JUnit Test Results
    # ----------------------------
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.browser }}
        path: target/surefire-reports/

    # ----------------------------
    # Upload Logs (if exists)
    # ----------------------------
    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ matrix.browser }}
        path: target/logs/

    # ----------------------------
    # Publish Test Report in GitHub UI
    # ----------------------------
    - name: Publish Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Cucumber Test Results - ${{ matrix.browser }}
        path: target/surefire-reports/*.xml
        reporter: java-junit
